name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lighthouse:
    name: Build, test and Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (every page, noindex, label, form makes no request)
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Lighthouse CI (mobile)
        run: npx lhci autorun --config=lighthouserc.cjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Lighthouse summary
        if: always()
        run: node scripts/lh-summary.mjs || true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  cloudflare-bundle:
    name: OpenNext Cloudflare bundle (build only, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Worker bundle with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke-test Worker locally (wrangler dev, no deploy)
        run: node scripts/cf-smoke.mjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
